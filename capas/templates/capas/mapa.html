{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor Geoespacial Pro</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'capas/css/mapa.css' %}" />
</head>
<body class="bg-light">

<div class="container-fluid p-4">
    <div class="row g-4">
        <!-- Panel Lateral -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 h-100 sidebar-card">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                    <h5 class="mb-0 fw-bold text-primary">Capas Disponibles</h5>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush capa-list">
                        {% for capa in capas %}
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div class="form-check">
                                <input class="form-check-input layer-checkbox" type="checkbox" value="{{ capa.id }}" id="layer-{{ capa.id }}" />
                                <label class="form-check-label cursor-pointer" for="layer-{{ capa.id }}">
                                    {{ capa.name }}
                                </label>
                            </div>
                            <!-- Spinner oculto por defecto -->
                            <div class="spinner-border spinner-border-sm text-primary d-none" id="spinner-{{ capa.id }}" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </li>
                        {% empty %}
                        <li class="list-group-item text-muted text-center py-4">
                            No hay capas disponibles en este momento.
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>

        <!-- Contenedor del Mapa -->
        <div class="col-md-9">
            <div class="card shadow-sm border-0 w-100">
                <!-- Estilo en línea para garantizar que el mapa sea visible aunque falle el CSS externo -->
                <div id="map" style="height: 80vh; min-height: 600px; width: 100%; border-radius: 0.5rem; z-index: 1;"></div>

            </div>
        </div>

        <div class="row mt-4 d-none" id="panel-metadatos-activos">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white pt-3 pb-2 border-bottom">
                            <h5 class="mb-0 fw-bold text-primary">
                                <i class="bi bi-info-circle me-2"></i> Metadatos de Capas Activas
                            </h5>
                        </div>
                        <div class="card-body bg-light">
                            <!-- Este div usará la cuadrícula de Bootstrap para apilar los cuadros de izquierda a derecha -->
                            <div id="contenido-metadatos" class="row g-3">
                                <!-- JS inyectará los cuadros aquí -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>

</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'capas/js/mapa.js' %}"></script>
</body>
</html>
